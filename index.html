<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2026年税费分析看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>window.echarts||document.write('<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"><\/script>');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Microsoft YaHei','宋体',sans-serif}
body{background:#fff;padding:20px;min-height:100vh;color:#000}
.header{background:#fff5cc;color:#000;padding:24px 32px;border-radius:12px;margin-bottom:16px;border:1px solid #e6daa0}
.header h1{font-size:24px;font-weight:bold}
.header p{font-size:13px;color:#666;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:#fff;border-radius:10px;padding:4px;box-shadow:0 0 0 1px #ddd;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:8px;cursor:pointer;font-size:13px;color:#666;transition:all .2s;border:none;background:none}
.tab:hover{background:#fff5cc}
.tab.active{background:#fff5cc;color:#000;font-weight:bold;border:1px solid #e6daa0}
.panel{display:none}
.panel.active{display:block}
.kpi-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:140px;background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 0 0 1px #ddd;border-left:4px solid #000}
.kpi-card .lbl{font-size:11px;color:#666;margin-bottom:2px}
.kpi-card .val{font-size:16px;font-weight:bold;color:#000}
.kpi-card .sub{font-size:10px;color:#999;margin-top:2px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.chart-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 0 0 1px #ddd}
.chart-card h3{font-size:14px;color:#000;margin-bottom:10px;padding-left:8px;border-left:3px solid #000}
.chart-card .chart-box{width:100%;height:280px}
.chart-card.full{grid-column:1/-1}
.chart-card.full .chart-box{height:320px}
.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table th{background:#fff5cc;color:#000;padding:6px 4px;text-align:center;font-weight:bold;border:1px solid #ccc;white-space:nowrap}
.data-table td{padding:4px;text-align:right;border:1px solid #ccc}
.data-table td:first-child,.data-table th:first-child{text-align:left}
.data-table tr:nth-child(even){background:#f9f9f9}
.data-table tr:hover{background:#fffbe6}
.clickable{cursor:pointer;color:#000;text-decoration:underline}
.clickable:hover{color:#c00}
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-bar input{padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;flex:1;min-width:160px}
.search-bar select{padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px}
.alert-list{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #ddd}
.alert-head{display:flex;padding:8px 12px;background:#fff5cc;color:#000;font-weight:bold;font-size:12px;border-bottom:1px solid #e6daa0}
.alert-head span{flex:1}
.alert-row{display:flex;padding:6px 12px;border-bottom:1px solid #eee;font-size:12px;cursor:pointer}
.alert-row:hover{background:#fff5cc}
.alert-row span{flex:1}
.alert-row .badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;color:#fff}
.badge-red{background:#c00}
.badge-yellow{background:#cc0;color:#000}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:12px;width:95%;max-width:1000px;max-height:85vh;overflow:auto;padding:24px;box-shadow:0 0 0 1px #000}
.modal-content h2{font-size:18px;color:#000;margin-bottom:16px}
.close-btn{float:right;font-size:24px;cursor:pointer;color:#999;border:none;background:none}
.close-btn:hover{color:#000}
.cmb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cmb button{padding:6px 14px;border:1px solid #ccc;border-radius:6px;cursor:pointer;background:#fff;font-size:12px}
.cmb button:hover{background:#fff5cc}
.cmb button.act{background:#000;color:#fff;border-color:#000}
.footer{text-align:center;color:#999;font-size:12px;padding:16px;margin-top:16px}
@media(max-width:768px){.chart-grid{grid-template-columns:1fr}.kpi-card{min-width:42%}}
</style></head>
<body>
<div class="header"><h1>2026年税费分析看板</h1><p>单位：元 | <span id="updateTime"></span></p></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('overview')">总览</button>
<button class="tab" onclick="switchTab('byCity')">按城市</button>
<button class="tab" onclick="switchTab('byCompany')">按公司</button>
<button class="tab" onclick="switchTab('small')">小规模纳税人</button>
<button class="tab" onclick="switchTab('pivot')">数据透视</button>
<button class="tab" onclick="switchTab('alerts')">预警</button>
</div>
<div id="panel-overview" class="panel active"><div class="kpi-row" id="kpiRow"></div>
<div class="chart-grid"><div class="chart-card full"><h3>月度收入趋势（万元）</h3><div class="chart-box" id="chartTrend"></div></div>
<div class="chart-card"><h3>各城市收入 vs 税费</h3><div class="chart-box" id="chartCity"></div></div>
<div class="chart-card"><h3>综合税负率排名</h3><div class="chart-box" id="chartRate"></div></div></div></div>

<div id="panel-byCity" class="panel"><div class="kpi-row" id="cityKpiRow"></div>
<div class="chart-card" style="margin-bottom:16px"><h3>各城市年度数据</h3><div id="cityTable"></div></div>
<div class="chart-card" id="cityCompanyCard" style="display:none"><h3 id="cityCompanyTitle"></h3><div id="cityCompanyTable"></div></div></div>

<div id="panel-byCompany" class="panel"><div class="search-bar">
<div id="companySearchContainer" style="position:relative;flex:1;min-width:200px">
  <div id="msDropdownTrigger" style="display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #d0d0d0;border-radius:8px;min-height:42px;background:#fff;cursor:pointer;transition:border-color .2s;font-size:13px;color:#333" onclick="event.stopPropagation();toggleCompanyDropdown()">
    <span id="msSelectionText" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#999">选择公司...</span>
    <span id="msBadge" style="display:none;background:#fff5cc;color:#000;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:bold;border:1px solid #e6daa0"></span>
    <span id="msArrow" style="font-size:10px;color:#999;transition:transform .2s">&#9660;</span>
  </div>
  <div id="companyDropdown" style="display:none;position:absolute;top:calc(100%+4px);left:0;width:360px;max-height:380px;overflow:hidden;border:1px solid #e0e0e0;border-radius:8px;background:#fff;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.12)">
    <div style="padding:8px 10px;border-bottom:1px solid #eee"><input type="text" id="msSearchInput" placeholder="搜索公司名称..." style="width:100%;border:1px solid #e0e0e0;border-radius:6px;padding:8px 10px;font-size:13px;outline:none" oninput="filterMsDropdown()"></div>
    <div style="padding:4px 8px;display:flex;gap:8px;font-size:11px;border-bottom:1px solid #eee"><span class="clickable" onclick="selectAllMs(true)">全选</span><span class="clickable" onclick="selectAllMs(false)" style="color:#999">清空</span></div>
    <div id="msDropdownList" style="max-height:260px;overflow-y:auto;font-size:13px"></div>
  </div>
</div>
<div id="ddCity" style="position:relative;min-width:130px"></div>
<div id="ddNature" style="position:relative;min-width:130px"></div>
<select id="sortBy" onchange="renderCompany()" style="padding:8px 14px;border:1px solid #d0d0d0;border-radius:8px;font-size:13px;color:#333;background:#fff;min-height:42px;cursor:pointer;outline:none">
  <option value="income">按收入</option><option value="rate">按税负</option><option value="name">按名称</option>
</select></div>
<div class="chart-card"><div id="companyTable"></div></div></div>

<div id="panel-small" class="panel"><div class="kpi-row" id="smallKpiRow"></div>
<div class="chart-grid"><div class="chart-card"><h3>小规模 vs 一般纳税人税负</h3><div class="chart-box" id="chartSmallCompare"></div></div>
<div class="chart-card"><h3>小规模城市分布</h3><div class="chart-box" id="chartSmallCity"></div></div></div>
<div class="chart-card"><h3>小规模纳税人清单</h3><div class="search-bar"><input type="text" id="smallSearch" placeholder="搜索..." oninput="renderSmallDetail()"></div>
<div style="overflow-x:auto" id="smallTable"></div></div></div>

<div id="panel-pivot" class="panel"><div class="chart-card"><h3>数据透视表</h3>
<div class="search-bar">
<select id="pivotRow" onchange="renderPivot()"><option value="city">行：按城市</option><option value="nature">行：按纳税人性质</option><option value="company">行：按公司</option></select>
<select id="pivotCol" onchange="renderPivot()"><option value="month">列：按月份</option><option value="total">列：汇总</option></select>
<select id="pivotVal" onchange="renderPivot()"><option value="income">值：收入</option><option value="vat">值：增值税</option><option value="total_tax">值：税费合计</option><option value="vat_rate">值：增值税税负(%)</option><option value="total_rate">值：综合税负率(%)</option></select>
<select id="pivotCity" onchange="renderPivot()"><option value="">全部城市</option></select>
<select id="pivotNature" onchange="renderPivot()"><option value="">全部</option><option value="小规模">仅小规模</option><option value="一般">仅一般纳税人</option></select>
<label style="font-size:12px"><input type="checkbox" id="pivotSort" onchange="renderPivot()" checked> 排序</label></div>
<div style="overflow-x:auto" id="pivotTable"></div><div id="pivotSummary" style="margin-top:8px;font-size:12px;color:#666"></div></div></div>

<div id="panel-alerts" class="panel"><div class="search-bar"><input type="text" id="alertSearch" placeholder="搜索..." oninput="renderAlerts()"></div>
<div class="alert-list"><div class="alert-head"><span>公司</span><span>性质</span><span>次数</span><span>说明</span><span>月份</span></div><div id="alertList"></div></div></div>

<div class="modal" id="companyModal"><div class="modal-content"><button class="close-btn" onclick="closeModal()">&times;</button>
<h2 id="modalTitle">月度明细</h2><div id="modalBody"></div></div></div>
<div class="footer">单位：元 | 自动生成</div>

  echarts.init(document.getElementById('chartSmallCity')).setOption({
    tooltip:{trigger:'axis'},legend:{data:['家数','收入']},grid:{left:'6%',right:'4%',bottom:'12%'},
    xAxis:{type:'category',data:bc.map(x=>x[0]),axisLabel:{rotate:25}},
    yAxis:[{type:'value',name:'家数'},{type:'value',name:'元'}],
    series:[{name:'家数',type:'bar',data:bc.map(x=>x[1].count),itemStyle:{color:'#000'}},
            {name:'收入',type:'line',yAxisIndex:1,data:bc.map(x=>x[1].income),lineStyle:{color:'#c00',width:2},itemStyle:{color:'#c00'}}]});renderSmallDetail();}

function renderSmallDetail(){
  const q=(document.getElementById('smallSearch').value||'').toLowerCase();
  const list=D.small_taxpayer.detail.filter(c=>!q||c.name.toLowerCase().includes(q));
  let h='<table class="data-table"><tr><th>公司名称</th><th>城市</th><th>收入</th><th>增值税</th><th>税费</th><th>滚动12月收入</th><th>年化收入</th><th>预警</th></tr>';
  list.forEach(c=>{const ws=c.warn_500?'style="background:#fee;font-weight:bold;color:#c00"':'';
    h+=`<tr><td>${c.name}</td><td>${c.city}</td><td>${fm(c.income)}</td><td>${fm(c.vat)}</td><td>${fm(c.tax)}</td>
    <td ${ws}>${fm(c.rolling_12m)}</td><td>${fm(c.annualized)}</td><td>${c.warn_text||'正常'}</td></tr>`;});
  document.getElementById('smallTable').innerHTML=h;}

// ====== 数据透视 ======
function renderPivot(){
  const rd=document.getElementById('pivotRow').value,cd=document.getElementById('pivotCol').value,
    vf=document.getElementById('pivotVal').value,cf=document.getElementById('pivotCity').value,
    nf=document.getElementById('pivotNature').value,ds=document.getElementById('pivotSort').checked;
  let list=D.companies;if(cf)list=list.filter(c=>c.city===cf);if(nf)list=list.filter(c=>c.nature.includes(nf));
  const rg={};list.forEach(c=>{const k=rd==='city'?c.city:rd==='nature'?c.nature:c.name;if(!rg[k])rg[k]=[];rg[k].push(c);});
  const cols=cd==='total'?['全年合计']:M;
  function agg(cos,f,m){if(m&&m!=='全年合计'){let t=0;cos.forEach(c=>{const md=D.company_monthly[c.name];if(md&&md[m])t+=md[m][f]||0;});return Math.round(t);}
    if(f==='income')return Math.round(cos.reduce((s,c)=>s+c.income,0));if(f==='vat')return Math.round(cos.reduce((s,c)=>s+c.vat,0));
    if(f==='total_tax')return Math.round(cos.reduce((s,c)=>s+c.total_tax,0));
    if(f==='vat_rate'){const ti=cos.reduce((s,c)=>s+c.income,0),tv=cos.reduce((s,c)=>s+c.vat,0);return ti>0?Math.round(tv/ti*10000)/100:0;}
    if(f==='total_rate'){const ti=cos.reduce((s,c)=>s+c.income,0),tt=cos.reduce((s,c)=>s+c.total_tax,0);return ti>0?Math.round(tt/ti*10000)/100:0;}return 0;}
  const isPct=vf==='vat_rate'||vf==='total_rate',gt=agg(list,vf,'全年合计'),gbm={};
  if(!isPct)cols.forEach(m=>{gbm[m]=agg(list,vf,m);});
  let rows=Object.entries(rg);if(ds&&!isPct){const tf=cd==='total'?'全年合计':cols[0];rows.sort((a,b)=>agg(b[1],vf,tf)-agg(a[1],vf,tf));}
  let h='<table class="data-table"><tr><th>'+(rd==='city'?'城市':rd==='nature'?'纳税人性质':'公司')+'</th>';
  cols.forEach(m=>{h+='<th>'+m+'</th>';});h+='<th>占比</th></tr>';
  rows.forEach(([k,cos])=>{h+='<tr><td><b>'+k+'</b></td>';
    cols.forEach(m=>{const v=agg(cos,vf,m);let pct='';if(!isPct&&gbm[m]&&gbm[m]>0)pct=(v/gbm[m]*100).toFixed(1)+'%';
      h+='<td>'+(isPct?v.toFixed(4)+'%':fm(v))+'<br><span style="font-size:9px;color:#999">'+pct+'</span></td>';});
    const rt=agg(cos,vf,'全年合计');h+='<td>'+(gt>0&&!isPct?(rt/gt*100).toFixed(1)+'%':'')+'</td></tr>';});
  h+='<tr style="background:#eee;font-weight:bold"><td>合计</td>';cols.forEach(m=>{h+='<td>'+(isPct?agg(list,vf,m).toFixed(4)+'%':fm(agg(list,vf,m)))+'</td>';});
  h+='<td>100%</td></tr></table>';
  document.getElementById('pivotTable').innerHTML=h;
  const cnt=list.length,ti=list.reduce((s,c)=>s+c.income,0),tt=list.reduce((s,c)=>s+c.total_tax,0);
  document.getElementById('pivotSummary').textContent='共'+cnt+'家公司 | 收入'+fm(ti)+'元 | 税费'+fm(tt)+'元 | 税负率'+(ti>0?(tt/ti*100).toFixed(4):'0')+'%';}
function initPivot(){const cs=[...new Set(D.companies.map(c=>c.city))];
  document.getElementById('pivotCity').innerHTML='<option value="">全部城市</option>'+cs.map(c=>`<option value="${c}">${c}</option>`).join('');renderPivot();}

// ====== 预警 ======
function renderAlerts(){const q=(document.getElementById('alertSearch').value||'').toLowerCase();
  const list=Object.entries(D.alerts).filter(([n])=>!q||n.toLowerCase().includes(q));
  let h='';list.forEach(([n,info])=>{const c=D.companies.find(x=>x.name===n),nature=c?c.nature:'';
    const clr=info.count>=4?'badge-red':'badge-yellow';
    h+=`<div class="alert-row" onclick="showModal('${n.replace(/'/g,"\\'")}')"><span><b>${n}</b></span><span>${nature}</span>
    <span><span class="badge ${clr}">${info.count}次</span></span><span>${info.details.join('; ')||'-'}</span><span>${info.months.join(', ')}</span></div>`;});
  document.getElementById('alertList').innerHTML=h||'<div style="padding:20px;text-align:center">无</div>';}
init();
</script></body></html>
